services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas-local-dev
      POSTGRES_DB: atlas
    ports:
      - "5442:5432"
    volumes:
      - atlas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    volumes:
      - atlas_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-local-dev
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - atlas_minio:/data

volumes:
  atlas_postgres:
  atlas_redis:
  atlas_minio:
