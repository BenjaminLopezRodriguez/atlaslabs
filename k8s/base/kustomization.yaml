apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlas
resources:
  - namespace.yaml
  - web-deployment.yaml
  - worker-deployment.yaml
  - migrate-job.yaml
# Production expectations (spec §10):
# - PostgreSQL and object storage are external managed services.
# - The `atlas-env` secret is sourced from a cloud secret manager.
